name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python PartCAD supports, and the newest.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The plugin runs in PartCAD's sandbox, beside PartCAD's 'plugin_models';
      # the tests need that one file, which is all '--no-deps' installs.
      - run: pip install pytest cryptography && pip install --no-deps "partcad>=0.9.17"
      - run: pytest -q

  lint:
    name: black, isort, flake8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "black==26.5.1" "isort==8.0.1" "flake8==7.3.0" "Flake8-pyproject==1.2.4"
      - run: black --check --diff .
      - run: isort --check --diff .
      - run: flake8 .
